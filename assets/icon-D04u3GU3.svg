  <rect x="64" y="64" width="384" height="384" rx="32" fill="none" stroke="#282a35" stroke-width="8"/>
  <!-- Inner padded photo area -->
  <rect x="112" y="112" width="288" height="288" rx="16" fill="#1c1d24" stroke="#d98b3f" stroke-width="6"/>
