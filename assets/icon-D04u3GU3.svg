  <circle cx="256" cy="256" r="32" fill="#d98b3f"/>
  <!-- Corner crop/squaring marks -->
  <path d="M96 144 V100 H140" fill="none" stroke="#d98b3f" stroke-width="6" stroke-linecap="round"/>
  <path d="M416 144 V100 H372" fill="none" stroke="#d98b3f" stroke-width="6" stroke-linecap="round"/>
  <path d="M96 368 V412 H140" fill="none" stroke="#d98b3f" stroke-width="6" stroke-linecap="round"/>
  <path d="M416 368 V412 H372" fill="none" stroke="#d98b3f" stroke-width="6" stroke-linecap="round"/>
